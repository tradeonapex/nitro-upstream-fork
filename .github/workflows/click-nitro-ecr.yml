---
# Builds the Nitro node image from this fork and pushes it to Click's ECR, so
# ansible-robinhood pulls an image we built and control instead of
# offchainlabs/nitro-node straight off Docker Hub. Branch model: CLICK.md.
name: click · nitro-node → ECR

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Tag, branch or SHA to build"
        required: true
        default: v3.12.1
      target:
        description: "Dockerfile target (nitro-node is what upstream publishes)"
        required: true
        default: nitro-node
        type: choice
        options:
          - nitro-node
          - nitro-node-slim
      runner:
        description: "Runner scale set"
        required: true
        default: lat-fra2-runners-rust
        type: choice
        options:
          - lat-fra2-runners-rust
          - lat-fra2-runners-release
          - lat-fra2-runners
      push:
        description: "Push to ECR (off = build only, to prove the build)"
        required: false
        default: true
        type: boolean
      force:
        description: "Rebuild even if the tag already exists in ECR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One build per upstream ref. Never cancel in progress: a cancelled build wastes
# the better part of an hour and leaves layers behind on the runner's node.
concurrency:
  group: click-nitro-${{ inputs.upstream_ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 257394448504.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: nitro-node

jobs:
  build:
    name: ${{ inputs.target }} @ ${{ inputs.upstream_ref }}
    runs-on: ${{ inputs.runner }}
    # Upstream builds this on a 16 CPU / 64 GB runner with a 60 min timeout. Our
    # pools are smaller, so allow a wide margin rather than losing a long build.
    timeout-minutes: 240

    steps:
      # Fail before the hour-long build rather than after it: this fork sees no
      # organisation secrets, so the AWS pair has to be set on the repository.
      - name: Check ECR credentials are visible to this repository
        if: inputs.push
        env:
          KEY: ${{ secrets.CI_AWS_ACCESS_KEY }}
          SECRET: ${{ secrets.CI_AWS_SECRET_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SECRET" ]; then
            echo "::error::CI_AWS_ACCESS_KEY / CI_AWS_SECRET_KEY are not readable here."
            echo "::error::Set them as repository secrets on tradeonapex/nitro, or widen the org secret to this repo."
            exit 1
          fi

      - name: Checkout ${{ inputs.upstream_ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.upstream_ref }}
          # All 14 submodules are public (go-ethereum, nitro-contracts, wasmer,
          # SoftFloat, brotli, …), so no token is needed here — upstream's
          # init-submodules action exists only for their -private mirror.
          submodules: recursive
          fetch-depth: 1
          fetch-tags: true

      - name: Resolve image tag
        id: meta
        run: |
          set -euo pipefail
          REF='${{ inputs.upstream_ref }}'
          COMMIT=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short=7 HEAD)

          # Upstream names its images <tag>-<short sha> (v3.12.1-70fa99a), and the
          # sha is the commit we actually built — so this reproduces upstream's
          # name for an unpatched build and diverges automatically for a patched
          # one. No "-click" counter to maintain.
          if git rev-parse -q --verify "refs/tags/${REF}" >/dev/null 2>&1; then
            NAME="$REF"
          else
            NAME=$(printf '%s' "$REF" | tr '/' '-')
          fi
          IMAGE_TAG="${NAME}-${SHORT}"
          # Keep variants from colliding on one tag.
          if [ '${{ inputs.target }}' != 'nitro-node' ]; then
            IMAGE_TAG="${IMAGE_TAG}-${{ inputs.target }}"
          fi

          {
            echo "commit=${COMMIT}"
            echo "short=${SHORT}"
            echo "image_tag=${IMAGE_TAG}"
            echo "tag_arg=${NAME}"
            echo "datetime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Will build ${{ inputs.target }} from ${COMMIT} as ${IMAGE_TAG}"

      - name: Configure AWS credentials
        if: inputs.push
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: inputs.push
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure the ECR repository exists
        if: inputs.push
        run: |
          set -euo pipefail
          aws ecr describe-repositories --registry-id 257394448504 --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
          || aws ecr create-repository \
               --registry-id 257394448504 \
               --repository-name "$ECR_REPOSITORY" \
               --image-scanning-configuration scanOnPush=true \
               --region "$AWS_REGION"

      # An hour of compute is worth one API call to find out it is unnecessary.
      - name: Skip if this tag is already in ECR
        if: ${{ inputs.push && !inputs.force }}
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --registry-id 257394448504 \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "::error::${ECR_REPOSITORY}:${IMAGE_TAG} already exists (${DIGEST}). Re-run with force=true to rebuild."
            exit 1
          fi

      # Optional, and only matters if the cluster's egress IP starts collecting
      # 429s: the Nitro build pulls debian, rust, golang, node and one legacy
      # offchainlabs image from Docker Hub. The alternative is mirroring those
      # bases through gitops/ecr-mirror.
      - name: Login to Docker Hub (optional, for pull rate limits)
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          # Single manifest, no attestation manifests: argocd-image-updater and
          # plain `docker pull` on a standalone host both want one image per tag.
          provenance: false
          # These land as NITRO_TAG/COMMIT/DATETIME/MODIFIED in the builder stage
          # and are what `nitro --version` reports.
          build-args: |
            tag=${{ steps.meta.outputs.tag_arg }}
            commit=${{ steps.meta.outputs.commit }}
            datetime=${{ steps.meta.outputs.datetime }}
            modified=false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}

      # The dind sidecar keeps no volume for /var/lib/docker, so every layer sits
      # on the node's ephemeral disk, shared with every other runner pod on it.
      - name: Reclaim the build cache
        if: always()
        run: |
          docker buildx prune --all --force || true
          docker image prune --all --force || true

      - name: Summary
        if: success()
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### nitro-node"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| upstream ref | \`${{ inputs.upstream_ref }}\` |"
            echo "| commit | \`${{ steps.meta.outputs.commit }}\` |"
            echo "| target | \`${{ inputs.target }}\` |"
            echo "| pushed | \`${{ inputs.push }}\` |"
            echo "| digest | \`${DIGEST:-n/a}\` |"
            echo
            echo "Set in \`rke2/<cluster>/inventory/host_vars/<host>\` (ansible-robinhood):"
            echo
            echo '```yaml'
            echo "robinhood_image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
